name: Deploy Static Website to EC2

on: push

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$EC2_SSH_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull latest website code on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem "ec2-user@$EC2_HOST" \
            "cd /home/ec2-user/frontend/s3-with-github-action-simple-app && git pull --ff-only origin static"